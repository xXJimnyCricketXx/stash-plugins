name: Grouped Tags View
description: Displays Stash tags grouped by their parent tags in a visual gallery.
version: 1.1.0
url: https://github.com/xXJimnyCricketXx/stash-plugins/tree/main/plugins/groupedTagsView
ui:
  javascript:
    - groupedTagsView.js
  css:
    - groupedTagsView.css
settings:
  categoryTag:
    displayName: Category root tag
    description: 'Name of the tag whose direct children are always shown as categories, even without tags of their own. Empty: "Kategorien" or "Categories".'
    type: STRING
  hideUncategorized:
    displayName: Hide ungrouped tags
    description: Do not show tags that have neither a parent nor children.
    type: BOOLEAN
  hideCounts:
    displayName: Hide tag counts
    description: Do not show the number of tags next to each category heading.
    type: BOOLEAN
  showStatistics:
    displayName: Show tag statistics
    description: Show the number of scenes, images, galleries, performers etc. on each tag card when hovering it (always visible on touch devices).
    type: BOOLEAN
